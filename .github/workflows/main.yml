name: Deploy Dart Web App

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Build Web Project
        run: dart compile js web/main.dart -o build/main.js # Adjust the path if your entry file is located elsewhere

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # Change this to your web build output directory if needed

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
